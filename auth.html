<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизація — Моніторинг праці</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f5f5f7;
      --card: rgba(255,255,255,.86);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --blue: #0071e3;
      --line: #dedee3;
      --red: #c9342f;
      --green: #248a3d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 15% 10%,
          #e7f2ff,
          transparent 35%
        ),
        var(--bg);
    }

    .wrap {
      width: min(100%, 430px);
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #1d1d1f;
      color: white;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.8px;
    }

    header p {
      margin: 7px 0 0;
      color: var(--muted);
    }

    .card {
      padding: 24px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 24px 70px rgba(0,0,0,.09);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      margin-bottom: 22px;
      background: #ededf0;
      border-radius: 12px;
    }

    .tab {
      border: 0;
      padding: 11px;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .tab.active {
      background: white;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .auth-form {
      display: none;
      gap: 15px;
    }

    .auth-form.active {
      display: grid;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #79b5ef;
      box-shadow: 0 0 0 4px rgba(0,113,227,.10);
    }

    .primary {
      height: 48px;
      border: 0;
      border-radius: 13px;
      background: var(--blue);
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .primary:disabled {
      opacity: .55;
    }

    .link {
      border: 0;
      background: transparent;
      color: var(--blue);
      font: inherit;
      cursor: pointer;
    }

    .message {
      margin: 0;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.45;
    }

    .message:not(:empty) {
      padding: 11px 12px;
    }

    .message.error {
      color: var(--red);
      background: #fff0ef;
    }

    .message.success {
      color: var(--green);
      background: #edf9f0;
    }

    footer {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 375px) {
      .card {
        padding: 19px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<main class="wrap">

  <header>
    <div class="logo">МП</div>
    <h1>Моніторинг праці</h1>
    <p>Робочий простір команди</p>
  </header>

  <section class="card">

    <div class="tabs">
      <button
        class="tab active"
        id="loginTab"
        type="button"
      >
        Увійти
      </button>

      <button
        class="tab"
        id="signupTab"
        type="button"
      >
        Реєстрація
      </button>
    </div>

    <form
      id="loginForm"
      class="auth-form active"
    >

      <div class="field">
        <label for="loginEmail">
          Робочий email
        </label>

        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          placeholder="name@company.com"
          required
        >
      </div>

      <div class="field">
        <label for="loginPassword">
          Пароль
        </label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          minlength="8"
          required
        >
      </div>

      <button
        class="primary"
        id="loginButton"
        type="submit"
      >
        Увійти
      </button>

      <button
        class="link"
        id="resetButton"
        type="button"
      >
        Забули пароль?
      </button>

      <p
        class="message"
        id="loginMessage"
      ></p>

    </form>

    <form
      id="signupForm"
      class="auth-form"
    >

      <div class="field">
        <label for="fullName">
          Ім’я та прізвище
        </label>

        <input
          id="fullName"
          type="text"
          autocomplete="name"
          minlength="2"
          placeholder="Олексій Петренко"
          required
        >
      </div>

      <div class="field">
        <label for="signupEmail">
          Робочий email
        </label>

        <input
          id="signupEmail"
          type="email"
          autocomplete="email"
          placeholder="name@company.com"
          required
        >
      </div>

      <div class="field">
        <label for="signupPassword">
          Пароль
        </label>

        <input
          id="signupPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="Мінімум 8 символів"
          required
        >
      </div>

      <div class="field">
        <label for="confirmPassword">
          Повторіть пароль
        </label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </div>

      <button
        class="primary"
        id="signupButton"
        type="submit"
      >
        Створити акаунт
      </button>

      <p
        class="message"
        id="signupMessage"
      ></p>

    </form>

  </section>

  <footer>
    Supabase Auth · профіль працівника створюється автоматично
  </footer>

</main>

<script>
  const SUPABASE_URL =
    "https://douvdhxbtpvjepexlrwn.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_NAFD7J-B98BSKTgnBh-6Cg_CRLQ68Fm";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const loginTab =
    document.getElementById("loginTab");

  const signupTab =
    document.getElementById("signupTab");

  const loginForm =
    document.getElementById("loginForm");

  const signupForm =
    document.getElementById("signupForm");

  const loginMessage =
    document.getElementById("loginMessage");

  const signupMessage =
    document.getElementById("signupMessage");


  function showMessage(
    element,
    text = "",
    type = ""
  ) {
    element.textContent = text;
    element.className =
      `message ${type}`.trim();
  }


  function openLogin() {
    loginForm.classList.add("active");
    signupForm.classList.remove("active");

    loginTab.classList.add("active");
    signupTab.classList.remove("active");

    showMessage(loginMessage);
    showMessage(signupMessage);
  }


  function openSignup() {
    signupForm.classList.add("active");
    loginForm.classList.remove("active");

    signupTab.classList.add("active");
    loginTab.classList.remove("active");

    showMessage(loginMessage);
    showMessage(signupMessage);
  }


  loginTab.addEventListener(
    "click",
    openLogin
  );

  signupTab.addEventListener(
    "click",
    openSignup
  );


  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const button =
        document.getElementById(
          "loginButton"
        );

      button.disabled = true;
      button.textContent = "Вхід…";

      showMessage(loginMessage);

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById(
            "loginPassword"
          )
          .value;


      const { error } =
        await client.auth
          .signInWithPassword({
            email,
            password
          });


      if (error) {

        showMessage(
          loginMessage,
          error.message,
          "error"
        );

        button.disabled = false;
        button.textContent = "Увійти";

        return;
      }


      window.location.href =
        "index.html";
    }
  );


  signupForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const button =
        document.getElementById(
          "signupButton"
        );

      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();

      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();

      const password =
        document
          .getElementById(
            "signupPassword"
          )
          .value;

      const confirmPassword =
        document
          .getElementById(
            "confirmPassword"
          )
          .value;


      if (
        password !==
        confirmPassword
      ) {

        showMessage(
          signupMessage,
          "Паролі не збігаються.",
          "error"
        );

        return;
      }


      button.disabled = true;
      button.textContent =
        "Створення…";


      const { data, error } =
        await client.auth.signUp({

          email,

          password,

          options: {

            emailRedirectTo:
              window.location.origin +
              "/auth.html",

            data: {
              full_name: fullName
            }

          }

        });


      if (error) {

        showMessage(
          signupMessage,
          error.message,
          "error"
        );

        button.disabled = false;

        button.textContent =
          "Створити акаунт";

        return;
      }


      if (data.session) {

        window.location.href =
          "index.html";

        return;
      }


      showMessage(
        signupMessage,
        "Акаунт створено. Перевірте електронну пошту та підтвердьте email.",
        "success"
      );


      signupForm.reset();

      button.disabled = false;

      button.textContent =
        "Створити акаунт";
    }
  );


  document
    .getElementById("resetButton")
    .addEventListener(
      "click",
      async function() {

        const email =
          document
            .getElementById(
              "loginEmail"
            )
            .value
            .trim();


        if (!email) {

          showMessage(
            loginMessage,
            "Спочатку введіть email.",
            "error"
          );

          return;
        }


        const { error } =
          await client.auth
            .resetPasswordForEmail(
              email,
              {
                redirectTo:
                  window.location.origin +
                  "/auth.html"
              }
            );


        if (error) {

          showMessage(
            loginMessage,
            error.message,
            "error"
          );

          return;
        }


        showMessage(
          loginMessage,
          "Лист для відновлення пароля надіслано.",
          "success"
        );

      }
    );

</script>

</body>
</html>
